name: Release

# Push a tag like `v0.2.0` (matching `version` in Cargo.toml) to build, sign and publish
# a full release for all platforms. Installed browsers pick it up automatically (see
# docs/RELEASING.md).
#
# To rebuild just one or two platforms for an EXISTING release (no new tag, no full
# 3-platform matrix, much cheaper), run this workflow manually ("Run workflow" in the
# Actions tab, or `gh workflow run release.yml -f tag=v0.2.0 -f platforms=windows`)
# with `tag` set to the existing release's tag and `platforms` to a comma-separated
# subset of windows,linux,macos. A manual run only uploads the rebuilt package(s) to
# that release; it does not touch manifest.json/SHA256SUMS.txt (those cover all
# platforms and are only regenerated by a full tag-triggered release), so download-only
# access to the new package works right away but the signed auto-updater manifest keeps
# pointing at whatever that platform's package was at the last full release until the
# next one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the rebuilt package(s) to (e.g. v0.2.0)'
        required: true
        type: string
      platforms:
        description: 'Comma-separated subset to build: windows, linux, macos'
        required: false
        type: string
        default: windows

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_key: windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_key: linux
          - os: macos-14
            target: aarch64-apple-darwin
            platform_key: macos
    runs-on: ${{ matrix.os }}
    env:
      # Compiled into the binary: where the updater looks for new releases.
      BROWSER_UPDATE_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # A manual run only builds the requested subset; a tag push always builds all
      # three. (Job-level `if:` can't see the `matrix` context on this API, so every
      # step below repeats this instead — cheap steps too, so a platform a manual run
      # didn't ask for barely spins up its runner.)
    steps:
      - name: Wanted this run?
        id: wanted
        shell: bash
        run: echo "yes=${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, matrix.platform_key) }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.wanted.outputs.yes == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.wanted.outputs.yes == 'true'
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: steps.wanted.outputs.yes == 'true'
        with:
          key: release-${{ matrix.target }}
      - name: Linux build dependencies
        if: steps.wanted.outputs.yes == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Check tag matches Cargo version
        if: steps.wanted.outputs.yes == 'true'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${RELEASE_TAG}" || { echo "tag ${RELEASE_TAG} != v$version"; exit 1; }
      - name: Build
        if: steps.wanted.outputs.yes == 'true'
        run: cargo build --release --locked --target ${{ matrix.target }} -p browser-core -p browser-launcher
      - name: Package
        if: steps.wanted.outputs.yes == 'true'
        run: cargo xtask package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: steps.wanted.outputs.yes == 'true'
        with:
          name: package-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Attach to release' || 'Sign and publish' }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      # The manifest/signature/checksums cover every platform of a release; only a full
      # tag-triggered run (which always builds all three) regenerates them.
      - name: Manifest
        if: github.event_name != 'workflow_dispatch'
        run: |
          cargo xtask manifest \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}" \
            dist/*.zip
      - name: Sign manifest
        if: github.event_name != 'workflow_dispatch'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: cargo xtask sign dist/manifest.json
      - name: Checksums
        if: github.event_name != 'workflow_dispatch'
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          files: |
            dist/*.zip
            dist/manifest.json
            dist/manifest.json.sig
            dist/SHA256SUMS.txt
