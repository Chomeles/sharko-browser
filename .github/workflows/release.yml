name: Release

# Releases are Windows-only (the browser isn't supported on Linux/macOS for now; the
# Linux/macOS build support in xtask is still there, just not published).
#
# A release is made when the `version` in Cargo.toml changes on master: the workflow derives
# the tag `v<version>` itself, builds, signs and publishes (nothing to push by hand; a
# version with a `-` suffix, e.g. 0.3.0-beta.1, is published as a pre-release). Pushing a
# tag like `v0.2.0` by hand (matching `version` in Cargo.toml) still works. Installed
# browsers pick a release up automatically (see docs/RELEASING.md).
#
# To rebuild the package of an EXISTING release without a new tag, run this workflow
# manually ("Run workflow" in the Actions tab) with `tag` set to the release's tag. A
# manual run only replaces the package; manifest.json/SHA256SUMS.txt are only
# regenerated by a tag-triggered release, so the auto-updater keeps the old checksum
# until the next one.
on:
  push:
    branches: [master]
    paths: ['Cargo.toml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the rebuilt package(s) to (e.g. v0.2.0)'
        required: true
        type: string
      platforms:
        description: 'Platforms to build (only windows is published)'
        required: false
        type: string
        default: windows

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The build matrix (Windows only). Platforms left out never request a runner.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.t.outputs.tag }}
      release: ${{ steps.t.outputs.release }}
      prerelease: ${{ steps.t.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # Which tag is released, and whether this run releases at all: a push to master only
      # does when Cargo.toml carries a version that has no tag yet.
      - id: t
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then release=false; else release=true; fi
          else
            tag="${INPUT_TAG:-${{ github.ref_name }}}"
            release=true
          fi
          case "$tag" in *-*) pre=true ;; *) pre=false ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "tag=$tag release=$release prerelease=$pre"
      - id: m
        shell: bash
        env:
          WANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platforms || 'windows' }}
        run: |
          all='[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","key":"windows"}]'
          keys=$(echo "$WANT" | tr -d ' ' | jq -R -c 'split(",")')
          m=$(echo "$all" | jq -c --argjson k "$keys" '{include: [.[] | select(.key as $x | $k | index($x))]}')
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # Compiled into the binary: where the updater looks for new releases.
      BROWSER_UPDATE_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: NASM (BoringSSL assembly on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Check tag matches Cargo version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${RELEASE_TAG}" || { echo "tag ${RELEASE_TAG} != v$version"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p browser-core -p browser-launcher
      - name: Package
        run: cargo xtask package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Attach to release' || 'Sign and publish' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      # The manifest/signature/checksums cover every platform of a release; only a full
      # tag-triggered run (which always builds all three) regenerates them.
      - name: Manifest
        if: github.event_name != 'workflow_dispatch'
        run: |
          cargo xtask manifest \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}" \
            dist/*.zip
      - name: Sign manifest
        if: github.event_name != 'workflow_dispatch'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: cargo xtask sign dist/manifest.json
      - name: Checksums
        if: github.event_name != 'workflow_dispatch'
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          files: |
            dist/*.zip
            dist/manifest.json
            dist/manifest.json.sig
            dist/SHA256SUMS.txt
