name: Release

# Push a tag like `v0.2.0` (matching `version` in Cargo.toml) to build, sign and publish
# a release. Installed browsers pick it up automatically (see docs/RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Compiled into the binary: where the updater looks for new releases.
      BROWSER_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Check tag matches Cargo version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p browser-core -p browser-launcher
      - name: Package
        run: cargo xtask package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Manifest
        run: |
          cargo xtask manifest \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            dist/*.zip
      - name: Sign manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: cargo xtask sign dist/manifest.json
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/manifest.json
            dist/manifest.json.sig
            dist/SHA256SUMS.txt
