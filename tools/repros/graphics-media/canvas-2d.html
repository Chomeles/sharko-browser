<!doctype html>
<meta charset="utf-8">
<title>canvas 2d gaps</title>
<!-- Backlog item 7. Chromium values in the comments. Sharko (Sep 29): toDataURL ignores the type (always PNG), shadows and ctx.filter are ignored,
     no bitmaprenderer context, OffscreenCanvas/ImageBitmap missing. -->
<body><canvas id="c" width="200" height="100"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const px = (cx, cy) => Array.from(x.getImageData(cx, cy, 1, 1).data);
const out = {};
const put = (k, f) => { try { out[k] = f(); } catch (e) { out[k] = 'ERR ' + e.message; } };
put('dataURL.jpeg', () => c.toDataURL('image/jpeg', 0.8).slice(0, 15));   // data:image/jpeg
put('dataURL.webp', () => c.toDataURL('image/webp').slice(0, 15));        // data:image/webp
put('dataURL.png', () => c.toDataURL().slice(0, 14));                     // data:image/png
put('shadow.alpha>0', () => { x.clearRect(0, 0, 200, 100); x.shadowColor = '#000'; x.shadowBlur = 4; x.shadowOffsetX = 12; x.fillStyle = '#f00'; x.fillRect(40, 20, 20, 20); x.shadowColor = 'transparent'; return px(64, 30)[3] > 0; }); // true
put('filter.grayscale', () => { x.clearRect(0, 0, 200, 100); x.filter = 'grayscale(1)'; x.fillStyle = '#f00'; x.fillRect(0, 0, 10, 10); x.filter = 'none'; const p = px(5, 5); return p[0] === p[1] && p[1] === p[2] && p[3] === 255; }); // true
put('filter.blur', () => { x.clearRect(0, 0, 200, 100); x.filter = 'blur(4px)'; x.fillStyle = '#f00'; x.fillRect(50, 50, 20, 20); x.filter = 'none'; const a = px(48, 60)[3]; return a > 0 && a < 255; }); // true
put('bitmaprenderer', () => !!document.createElement('canvas').getContext('bitmaprenderer'));  // true
put('OffscreenCanvas', () => typeof OffscreenCanvas);                     // function
put('ImageBitmap', () => typeof ImageBitmap);                             // function
put('offscreen.2d', () => { const o = new OffscreenCanvas(10, 10), g = o.getContext('2d'); g.fillStyle = '#0f0'; g.fillRect(0, 0, 10, 10); return Array.from(g.getImageData(5, 5, 1, 1).data).join(); }); // 0,255,0,255
put('offscreen.convertToBlob', () => typeof new OffscreenCanvas(1, 1).convertToBlob);   // function
put('createImageBitmap.canvas', () => typeof createImageBitmap(c).then);  // function (a promise)
put('transferControlToOffscreen', () => { const k = document.createElement('canvas'); return typeof k.transferControlToOffscreen() ; }); // object
put('measureText.actualBoundingBox', () => { x.font = '20px Arial'; const m = x.measureText('Hg'); return m.actualBoundingBoxAscent > 10 && m.fontBoundingBoxAscent > 10; }); // true
put('colorSpace', () => x.getContextAttributes().colorSpace);             // srgb
window.report = () => JSON.stringify(out);
const want = { 'dataURL.jpeg': 'data:image/jpeg', 'dataURL.webp': 'data:image/webp', 'dataURL.png': 'data:image/png', 'shadow.alpha>0': true, 'filter.grayscale': true, 'filter.blur': true, bitmaprenderer: true, OffscreenCanvas: 'function', ImageBitmap: 'function', 'offscreen.2d': '0,255,0,255', 'offscreen.convertToBlob': 'function', 'createImageBitmap.canvas': 'function', transferControlToOffscreen: 'object', 'measureText.actualBoundingBox': true, colorSpace: 'srgb' };
const bad = Object.keys(want).filter((k) => out[k] !== want[k]);
window.__repro = { issue: 'canvas-2d-gaps', expected: want, actual: out, pass: bad.length === 0, failing: bad };
</script>
