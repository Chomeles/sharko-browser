<!doctype html>
<meta charset="utf-8">
<title>what a script sees while the parser is still running</title>
<!-- Browsers parse incrementally: a parser-blocking script sees only the markup before it. Sharko parses the whole document first, then runs the scripts,
     so later elements are visible, document.body exists in <head> scripts and document.write text is not merged with the following text.
     Fix: streaming html5ever parse with script pauses (backlog item 1). Expected values from Chromium. -->
<script>
window.__r = {};
__r.headBodyNull = document.body === null;
__r.headSeesLater = !!document.getElementById('later');
__r.headReadyState = document.readyState;
__r.headDocumentElementChildren = document.documentElement.childNodes.length;
</script>
