<title>CORS: response check, preflight, credentials, Sec-Fetch-Mode</title>
<!-- Cross-origin server: same code on the next port (serve.js). Chromium: a cors-mode response without a matching Access-Control-Allow-Origin
     rejects with TypeError, a non-simple request is preceded by an OPTIONS preflight (and never sent if the preflight fails), credentials 'include'
     needs an exact ACAO plus ACAC. Sharko: the JS layer marks the response 'cors' without checking anything, and the network stack sends no preflight. -->
