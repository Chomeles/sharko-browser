<!doctype html>
<meta charset="utf-8">
<title>WebCrypto: asymmetric algorithms and key formats</title>
<!-- Chromium: ECDSA/ECDH (P-256/384/521), RSASSA-PKCS1-v1_5, RSA-PSS, RSA-OAEP, Ed25519, X25519 generate, sign/verify, derive, encrypt and export as
     spki/pkcs8/jwk/raw. Sharko (crates/script/src/natives/crypto.rs + the crypto section of 40_webapi.js): digests, HMAC, AES-*, PBKDF2 and HKDF
     only; everything else rejects with NotSupportedError. -->
<script src="repro.js"></script>
<script>
var S = crypto.subtle, enc = new TextEncoder(), rsa = { modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' };
function hex(b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
function t(k, f) { c(k, function (done) { f().then(done, function (e) { done('rejected ' + (e && e.name)); }); }, 8000); }
addEventListener('load', function () {
  t('ecdsaP256SignVerify', async function () { var k = await S.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']); var a = { name: 'ECDSA', hash: 'SHA-256' };
    var sig = await S.sign(a, k.privateKey, enc.encode('m')); return sig.byteLength + ':' + await S.verify(a, k.publicKey, sig, enc.encode('m')); });
  t('ecdsaExportFormats', async function () { var k = await S.generateKey({ name: 'ECDSA', namedCurve: 'P-384' }, true, ['sign', 'verify']);
    var r = await Promise.all([S.exportKey('spki', k.publicKey), S.exportKey('raw', k.publicKey), S.exportKey('pkcs8', k.privateKey), S.exportKey('jwk', k.publicKey)]); return [r[0].byteLength, r[1].byteLength, r[2].byteLength > 100, r[3].kty, r[3].crv].join(); });
  t('ecdhDeriveBitsAgree', async function () { var a = { name: 'ECDH', namedCurve: 'P-256' }, x = await S.generateKey(a, true, ['deriveBits']), y = await S.generateKey(a, true, ['deriveBits']);
    var b1 = await S.deriveBits({ name: 'ECDH', public: y.publicKey }, x.privateKey, 256), b2 = await S.deriveBits({ name: 'ECDH', public: x.publicKey }, y.privateKey, 256); return (hex(b1) === hex(b2)) + ':' + b1.byteLength; });
  t('rsassaPkcs1SignVerify', async function () { var k = await S.generateKey(Object.assign({ name: 'RSASSA-PKCS1-v1_5' }, rsa), true, ['sign', 'verify']);
    var sig = await S.sign('RSASSA-PKCS1-v1_5', k.privateKey, enc.encode('m')), ok = await S.verify('RSASSA-PKCS1-v1_5', k.publicKey, sig, enc.encode('m')), sp = await S.exportKey('spki', k.publicKey); return sig.byteLength + ':' + ok + ':' + sp.byteLength; });
  t('rsaPssSignVerify', async function () { var k = await S.generateKey(Object.assign({ name: 'RSA-PSS' }, rsa), false, ['sign', 'verify']); var a = { name: 'RSA-PSS', saltLength: 32 };
    return S.verify(a, k.publicKey, await S.sign(a, k.privateKey, enc.encode('m')), enc.encode('m')); });
  t('rsaOaepEncryptDecrypt', async function () { var k = await S.generateKey(Object.assign({ name: 'RSA-OAEP' }, rsa), true, ['encrypt', 'decrypt']);
    var ct = await S.encrypt('RSA-OAEP', k.publicKey, enc.encode('secret')), pt = await S.decrypt('RSA-OAEP', k.privateKey, ct); return ct.byteLength + ':' + new TextDecoder().decode(pt); });
  t('ed25519SignVerify', async function () { var k = await S.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
    var sig = await S.sign('Ed25519', k.privateKey, enc.encode('m')), ok = await S.verify('Ed25519', k.publicKey, sig, enc.encode('m')), raw = await S.exportKey('raw', k.publicKey); return sig.byteLength + ':' + ok + ':' + raw.byteLength; });
  t('x25519DeriveBits', async function () { var x = await S.generateKey('X25519', true, ['deriveBits']), y = await S.generateKey('X25519', true, ['deriveBits']);
    return (await S.deriveBits({ name: 'X25519', public: y.publicKey }, x.privateKey, 256)).byteLength; });
  t('jwkImportedPrivateKeySigns', async function () { var a = { name: 'ECDSA', namedCurve: 'P-256' }, k = await S.generateKey(a, true, ['sign', 'verify']), jwk = await S.exportKey('jwk', k.privateKey);
    var priv = await S.importKey('jwk', jwk, a, false, ['sign']), h = { name: 'ECDSA', hash: 'SHA-256' }; return S.verify(h, k.publicKey, await S.sign(h, priv, enc.encode('m')), enc.encode('m')); });
  t('importRawEcdsaPublicKey', async function () { var g = new Uint8Array([4, 107, 23, 209, 242, 225, 44, 66, 71, 248, 188, 230, 229, 99, 164, 64, 242, 119, 3, 125, 129, 45, 235, 51, 160, 244, 161, 57, 69, 216, 152, 194, 150, 79, 227, 66, 226, 254, 26, 127, 155, 142, 231, 235, 74, 124, 15, 158, 22, 43, 206, 51, 87, 107, 49, 94, 206, 203, 182, 64, 104, 55, 191, 81, 245]);
    var k = await S.importKey('raw', g, { name: 'ECDSA', namedCurve: 'P-256' }, true, ['verify']); return k.type + ':' + k.algorithm.namedCurve; });
  t('aesKwWrapUnwrap', async function () { var kek = await S.generateKey({ name: 'AES-KW', length: 256 }, true, ['wrapKey', 'unwrapKey']), key = await S.generateKey({ name: 'AES-GCM', length: 128 }, true, ['encrypt']);
    var w = await S.wrapKey('raw', key, kek, 'AES-KW'); await S.unwrapKey('raw', w, kek, 'AES-KW', 'AES-GCM', true, ['encrypt']); return w.byteLength; });
  finish('crypto-asym', { ecdsaP256SignVerify: '64:true', ecdsaExportFormats: '120,97,true,EC,P-384', ecdhDeriveBitsAgree: 'true:32', rsassaPkcs1SignVerify: '256:true:294', rsaPssSignVerify: true, rsaOaepEncryptDecrypt: '256:secret',
    ed25519SignVerify: '64:true:32', x25519DeriveBits: 32, jwkImportedPrivateKeySigns: true, importRawEcdsaPublicKey: 'public:P-256', aesKwWrapUnwrap: 24 });
});
</script>
