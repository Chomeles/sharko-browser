[package]
name = "shell"
version.workspace = true
edition.workspace = true
description = "Windowed UI: browser chrome (tabs, toolbar) + GPU compositor"

[dependencies]
browser = { path = "../browser" }
common = { path = "../common" }
engine = { path = "../engine" }
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true
anyrender.workspace = true
anyrender_vello = "0.14"
anyrender_vello_cpu = { workspace = true, features = ["softbuffer_window_renderer"] }
winit = "0.30"
kurbo = "0.13"
peniko = "0.6"
arboard = "3"
crossbeam-channel = "0.5"
keyboard-types = "0.7"
cursor-icon = "1"
pollster = "1.0"
log = "0.4"
