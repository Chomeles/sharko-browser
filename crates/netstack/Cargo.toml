[package]
name = "netstack"
version.workspace = true
edition.workspace = true
description = "Network stack + network service process"

[dependencies]
common = { path = "../common" }
blitz-traits.workspace = true
url.workspace = true
serde.workspace = true
tokio.workspace = true
wreq = { version = "0.16.1", default-features = false, features = ["tokio-rt", "webpki-roots", "gzip", "deflate", "brotli", "zstd", "system-proxy", "stream", "socks", "prefix-symbols"] }
wreq-util = { version = "0.2.0", default-features = false, features = ["emulation"] }
rustls-native-certs = "0.8"
webpki-root-certs = "1"
http = "1.3"
bytes = { version = "1.10", features = ["serde"] }
cookie_store = { version = "0.22.1", default-features = false, features = ["public_suffix", "serde_json", "preserve_order"] }
publicsuffix = "2.3"
data-url = "0.3.2"
mime_guess = "2.0.5"
percent-encoding = "2.3"
httpdate = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
serde_bytes = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
log = "0.4"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
hyper = { version = "1.7", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
flate2 = "1"
brotli = "8"
zstd = "0.13"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "logging", "aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }



