[package]
name = "netstack"
version.workspace = true
edition.workspace = true
description = "Network stack + network service process"

[features]
default = ["aws-lc", "http3"]
# TLS crypto provider for rustls. Exactly one is used; `aws-lc` wins if both are enabled.
#
# * `aws-lc` (default): aws-lc-rs. Fastest provider (AES-GCM/ChaCha20 assembly, AVX-512
#   paths) and the only one with post-quantum hybrid key exchange (X25519MLKEM768, which
#   Chrome also prefers). Builds without CMake (cc builder) and, on x86_64 Windows,
#   without NASM (rustls enables aws-lc-rs' `prebuilt-nasm`).
# * `ring`: pure-Rust/asm fallback with the smallest C footprint. HTTP/3 is not
#   available with it (reqwest's QUIC integration is hard-wired to aws-lc-rs). Build with
#   `--no-default-features --features ring`.
aws-lc = ["reqwest/rustls", "rustls/aws_lc_rs", "rustls/prefer-post-quantum"]
ring = ["reqwest/rustls-no-provider", "rustls/ring"]
# HTTP/3 (QUIC) with Alt-Svc upgrade. Needs `--cfg reqwest_unstable` (set in
# .cargo/config.toml) and implies `aws-lc`.
http3 = ["reqwest/http3", "aws-lc"]

[dependencies]
common = { path = "../common" }
blitz-traits.workspace = true
url.workspace = true
serde.workspace = true
tokio.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "gzip", "deflate", "brotli", "zstd", "system-proxy", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "logging"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1.3"
bytes = { version = "1.10", features = ["serde"] }
cookie_store = { version = "0.22.1", default-features = false, features = ["public_suffix", "serde_json", "preserve_order"] }
publicsuffix = "2.3"
data-url = "0.3.2"
mime_guess = "2.0.5"
percent-encoding = "2.3"
httpdate = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
serde_bytes = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
log = "0.4"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
hyper = { version = "1.7", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
flate2 = "1"
brotli = "9"
zstd = "0.13"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
