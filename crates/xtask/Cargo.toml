[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false
description = "Build tooling: packaging, release manifests, update signing, license notices"

[dependencies]
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
ed25519-dalek = "3"
base64 = "0.22"
getrandom = "0.3"
