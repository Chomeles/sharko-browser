[package]
name = "script"
version.workspace = true
edition.workspace = true
description = "V8 JavaScript runtime + DOM bindings"
build = "build.rs"

[features]
# Compile the ICU data (~10 MB, for Intl) into the binary. Release builds leave this off
# and load `resources/icudtl.dat` at runtime instead (see `platform.rs`).
default = ["embedded-icu"]
embedded-icu = ["dep:deno_core_icudata"]

[dependencies]
common = { path = "../common" }
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-traits.workspace = true
url.workspace = true
v8 = "152.2"
deno_core_icudata = { version = "0.78", optional = true }
encoding_rs = "0.8"
getrandom = "0.3"
# Web Crypto primitives (already built for rustls).
aws-lc-rs = "1.18"
serde_json = "1"
keyboard-types = "0.7"
# Stylo (exactly the versions blitz-dom 0.3.0-beta.2 uses) for inline/computed style,
# media queries and CSS.supports.
style = { package = "stylo", version = "=0.21.0" }
style_traits = { package = "stylo_traits", version = "=0.21.0" }
style_dom = { package = "stylo_dom", version = "=0.21.0" }
cssparser = "0.37"
html5ever = "0.39"
smallvec = "1"
selectors = "0.40"

[dev-dependencies]
