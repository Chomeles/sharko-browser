# Build configuration.
# `--cfg reqwest_unstable` enables reqwest's HTTP/3 (QUIC) support.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "--cfg", "reqwest_unstable"]

# Windows: static CRT, so the release needs no Visual C++ runtime installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["--cfg", "reqwest_unstable", "-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["--cfg", "reqwest_unstable", "-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["--cfg", "reqwest_unstable"]

[target.'cfg(target_os = "macos")']
rustflags = ["--cfg", "reqwest_unstable"]

[build]
jobs = 2

[alias]
xtask = "run --quiet --package xtask --"
