# Build configuration.
# `--cfg reqwest_unstable` enables reqwest's HTTP/3 (QUIC) support.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "--cfg", "reqwest_unstable"]

[target.x86_64-pc-windows-msvc]
rustflags = ["--cfg", "reqwest_unstable"]

[target.aarch64-pc-windows-msvc]
rustflags = ["--cfg", "reqwest_unstable"]

[target.'cfg(target_os = "macos")']
rustflags = ["--cfg", "reqwest_unstable"]

[build]
jobs = 2
