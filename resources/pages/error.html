<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{t.error.title}}</title>
<style>
body { font-family: system-ui, "Segoe UI", sans-serif; background: #f6f7f9; color: #1f2328; display: flex; justify-content: center; padding-top: 15vh; margin: 0; }
.box { max-width: 560px; padding: 0 24px; }
h1 { font-size: 24px; font-weight: 600; }
code { background: #eaeef2; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
p { color: #57606a; line-height: 1.5; }
</style>
</head>
<body>
<div class="box">
  <h1>{{t.error.heading}}</h1>
  <p><code>{{url}}</code></p>
  <p>{{error}}</p>
</div>
</body>
</html>
