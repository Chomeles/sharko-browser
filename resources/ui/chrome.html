<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>{{css}}</style></head>
<body>
<div id="strip"></div>
<div id="toolbar">
  <div id="nav" style="display:flex"></div>
  <div id="omnibox">
    <div id="lock"></div>
    <input id="url" type="text" spellcheck="false" placeholder="{{t.omnibox.placeholder}}">
    <div id="zoom" class="hidden" data-action="zoom" title="{{t.toolbar.zoom_reset}}"></div>
  </div>
  <div id="update" class="hidden" data-action="restart" title="{{t.update.ready_tooltip}}">{{t.update.ready}}</div>
</div>
</body>
</html>
